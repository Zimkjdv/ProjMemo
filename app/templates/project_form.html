{% extends "base.html" %}
{% block title %}{{ form_title }}｜ProjMemo{% endblock %}
{% block content %}
<div class="section-heading">
  <div>
    <nav class="breadcrumb" aria-label="breadcrumb"><a href="/">專案列表</a>{% if project %}<span aria-hidden="true">/</span><a href="/projects/{{ project.id }}">{{ project.name }}</a>{% endif %}</nav>
    <p class="eyebrow">PROJECT SETTINGS</p>
    <h1>{{ form_title }}</h1>
    <p class="form-intro">基本資訊能幫你日後快速辨識專案，也會出現在專案匯出文件中。</p>
  </div>
  <a class="button button-ghost" href="{% if project %}/projects/{{ project.id }}{% else %}/{% endif %}">取消</a>
</div>

<form class="panel form-panel" method="post" action="{% if project %}/projects/{{ project.id }}/edit{% else %}/projects/new{% endif %}">
  <div class="form-section-heading"><span class="form-section-icon" aria-hidden="true">01</span><div><h2>專案基本資料</h2><p>名稱、目前狀態與相關負責人。</p></div></div>
  <label>專案名稱 <span class="required">*</span><input name="name" required value="{{ project.name if project else '' }}" placeholder="例如：客戶入口網站"></label>
  <label>專案描述<textarea name="description" rows="4" placeholder="簡單說明專案用途、範圍或目前進度">{{ project.description if project else '' }}</textarea></label>
  <div class="form-grid two-columns">
    <label>專案狀態
      <select name="status">
        {% for value, label in status_options %}<option value="{{ value }}" {% if (project.status if project else 'maintenance') == value %}selected{% endif %}>{{ label }}</option>{% endfor %}
      </select>
    </label>
    <label>負責人<input name="owner" value="{{ project.owner if project else '' }}" placeholder="姓名或團隊"></label>
  </div>
  <label>標籤 <span class="field-help">用逗號分隔，方便之後搜尋，例如：Python, API, legacy</span><input name="tags" value="{{ project.tags if project else '' }}" placeholder="Python, API"></label>
  <div class="form-actions"><a class="button button-ghost" href="{% if project %}/projects/{{ project.id }}{% else %}/{% endif %}">取消</a><button class="button button-primary" type="submit">儲存專案</button></div>
</form>
{% endblock %}
