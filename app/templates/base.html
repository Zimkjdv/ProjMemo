<!doctype html>
<html lang="{{ language }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}ProjMemo{% endblock %}</title>
    <meta name="referrer" content="same-origin">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}?v=20261015-r05">
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="/" aria-label="{{ t("ProjMemo 首頁") }}"><span class="brand-symbol">P</span><span><strong>ProjMemo</strong><small>{{ t('專案備註，整理有序。') }}</small></span></a>
        <nav class="header-nav" aria-label="{{ t("主要導覽") }}">
          <a class="nav-link" href="/">{{ t("我的專案") }}</a>
          <a class="nav-link" href="/settings/vault">{{ t("密碼保管庫") }}</a>
          <a class="nav-link backup-nav-link" href="/settings/backup">{{ t("資料備份") }}</a>
          <form class="language-switch" method="post" action="/settings/language" aria-label="{{ t('介面語言') }}">{{ csrf_input() }}
            <input type="hidden" name="return_to" value="{{ return_to }}">
            <button type="submit" name="language" value="zh-Hant" class="{% if language == 'zh-Hant' %}active{% endif %}" aria-pressed="{{ 'true' if language == 'zh-Hant' else 'false' }}" lang="zh-Hant">繁中</button>
            <button type="submit" name="language" value="en" class="{% if language == 'en' %}active{% endif %}" aria-pressed="{{ 'true' if language == 'en' else 'false' }}" lang="en">EN</button>
          </form>
          <a class="button button-primary" href="/projects/new"><span aria-hidden="true">＋</span> {{ t("建立專案") }}</a>
        </nav>
      </div>
    </header>
    <main class="container page-content">
      {% if request.query_params.get('notice') == 'saved' %}<div class="operation-success" role="status" tabindex="-1">{{ t('已儲存變更。') }}</div>{% endif %}
      {% block content %}{% endblock %}
    </main>
    <script src="/static/language.js?v=20261015-r05" defer></script>
    <script src="/static/vault-session.js?v=20261014" defer></script>
    <script src="/static/form-feedback.js?v=20261015" defer></script>
    <script src="/static/form-submit.js?v=20261015" defer></script>
    <script type="application/json" id="draft-guard-messages">{{ {'discard': t('尚有未儲存的修改。確定捨棄並離開？')}|tojson }}</script>
    <dialog id="draft-leave-dialog" class="content-discard-dialog" aria-labelledby="draft-leave-title">
      <h3 id="draft-leave-title">{{ t('捨棄未儲存的修改？') }}</h3>
      <p>{{ t('尚有未儲存的修改。確定捨棄並離開？') }}</p>
      <div class="content-form-actions"><button type="button" class="button button-ghost" data-stay-page autofocus>{{ t('保留修改') }}</button><button type="button" class="button button-danger" data-leave-page>{{ t('捨棄並離開') }}</button></div>
    </dialog>
    <script src="/static/draft-guard.js?v=20261015" defer></script>
  </body>
</html>
