{% macro settings_icon(kind) -%}
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
  {% if kind == 'shield' %}<path d="M12 3 4 6v6c0 5 8 9 8 9s8-4 8-9V6l-8-3Z"/><path d="m8.5 12 2.5 2.5 4.5-5"/>
  {% elif kind == 'lock' %}<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/>
  {% elif kind == 'unlock' %}<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 7.5-2M12 14v3"/>
  {% elif kind == 'export' %}<path d="M12 3v12m-4-4 4 4 4-4M5 16v4h14v-4"/>
  {% elif kind == 'restore' %}<path d="M3 10a9 9 0 1 1 2 8M3 4v6h6M12 7v5l3 2"/>
  {% elif kind == 'database' %}<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
  {% elif kind == 'key' %}<circle cx="8" cy="8" r="5"/><path d="m11.5 11.5 9 9M16 16l3-3M18 18l3-3"/>
  {% elif kind == 'copy' %}<rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V4a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h4"/>
  {% elif kind == 'more' %}<g fill="currentColor" stroke="none"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></g>
  {% elif kind == 'link' %}<path d="m10 13 4-4M8 16l-1 1a4 4 0 0 1-6-6l4-4a4 4 0 0 1 6 0m2 2 1-1a4 4 0 0 1 6 6l-4 4a4 4 0 0 1-6 0"/>
  {% elif kind == 'alert' %}<path d="m12 3 10 18H2L12 3Z"/><path d="M12 9v5m0 3h.01"/>
  {% elif kind == 'bug' %}<rect x="7" y="7" width="10" height="13" rx="5"/><path d="M9 7V4h6v3M3 10h4m10 0h4M3 16h4m10 0h4M12 7v13"/>
  {% elif kind == 'tool' %}<path d="M14 6a5 5 0 0 0-6 6L3 17a3 3 0 0 0 4 4l5-5a5 5 0 0 0 6-6l-3 3-4-4 3-3Z"/>
  {% elif kind == 'note' %}<path d="M5 3h10l4 4v14H5V3Zm10 0v5h4M8 12h8m-8 4h6"/>
  {% elif kind == 'clock' %}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
  {% elif kind == 'desktop' %}<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/>
  {% endif %}
</svg>
{%- endmacro %}
